# Video call (mobile_v8) under /zoom on an existing nginx site.
# Put these location blocks INSIDE the existing `server { ... }` (the HTTPS one, listen 443 ssl),
# e.g. save as /etc/nginx/snippets/zoom.conf and add `include snippets/zoom.conf;` into that server block.
# Camera/microphone work only over HTTPS (or localhost).
#
# Files: copy of https://github.com/DmitryPodyachev/DmitryPodyachev.github.io/tree/main/mobile_v8
#        -> /var/www/zoom/   (see zoom-sync.sh)

location = /zoom { return 301 /zoom/; }

# files live in /var/www/zoom/ -> "root /var/www" (no alias pitfalls)
location /zoom/ {
    root /var/www;
    index index.html;
    try_files $uri $uri/ =404;
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), fullscreen=(self)" always;

    # service worker and html: always revalidate, otherwise updates arrive late
    location ~ ^/zoom/(sw\.js|index\.html)?$ {
        add_header Cache-Control "no-cache" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), fullscreen=(self)" always;
    }
    location ~* ^/zoom/.+\.(js|css|png|webmanifest)$ {
        add_header Cache-Control "public, max-age=300" always;
    }
}

# Presence/admin server (Cloudflare Worker) via this host:
#   /zoom/admin2[/]      -> admin page without password (tests)
#   /zoom/admin[/]       -> admin page with password (Basic Auth is passed through)
#   /zoom/api/...        -> its API (the admin page loads /zoom/api/peers2 or /zoom/api/peers)
location ~ ^/zoom/(admin2?/?|api/.*)$ {
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    set $vc_upstream vc.goldberg.pp.ua;
    proxy_pass https://$vc_upstream/$1$is_args$args;
    proxy_ssl_server_name on;
    proxy_ssl_name vc.goldberg.pp.ua;
    proxy_set_header Host vc.goldberg.pp.ua;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Zoom-Proxy 1;      # worker then takes country/provider from the client, not from this server
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    add_header X-Robots-Tag "noindex" always;
}

# Own signalling server (zoom-signal, Node, 127.0.0.1:9000): PeerJS WebSocket + TURN credentials.
# Replaces the public 0.peerjs.com, which answers 403 to Russian IPs.
location /zoom/peerjs/ {
    proxy_pass http://127.0.0.1:9000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}
location = /zoom/turn          { proxy_pass http://127.0.0.1:9000; proxy_set_header Host $host; }
location = /zoom/signal-health { proxy_pass http://127.0.0.1:9000; proxy_set_header Host $host; }
