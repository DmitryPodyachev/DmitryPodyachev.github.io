# coturn for the video call app (/zoom). Copy to /etc/turnserver.conf.
# Credentials are short-lived (TURN REST API): zoom-signal hands them out at /zoom/turn,
# signed with the same secret as static-auth-secret below (/etc/zoom-signal.env TURN_SECRET).
listening-port=3478
fingerprint
use-auth-secret
static-auth-secret=__TURN_SECRET__
realm=__TURN_HOST__
server-name=__TURN_HOST__
# relay ports (open them in the firewall, UDP)
min-port=49160
max-port=49250
# limits against abuse
total-quota=100
user-quota=12
max-bps=3000000
stale-nonce=600
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1
# never relay into private / local networks
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
log-file=/var/log/turnserver.log
simple-log
