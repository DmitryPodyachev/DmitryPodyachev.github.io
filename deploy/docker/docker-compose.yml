# Video call (/zoom) backend in docker: own signalling server + TURN relay.
# The app files and the HTTPS entry stay with the host nginx (deploy/nginx-zoom.conf).
# Start:   cd /opt/zoom/deploy/docker && docker compose up -d --build   (or just run setup.sh)
# Values come from .env next to this file (TURN_SECRET, TURN_HOST, ORIGINS) – setup.sh creates it.
name: zoom

services:
  signal:
    build: ../../zoom-server
    image: zoom-signal:local
    restart: unless-stopped
    env_file: .env
    environment:
      BIND: 0.0.0.0
      PORT: 9000
    ports:
      - "127.0.0.1:9000:9000"        # only host nginx reaches it
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }

  coturn:
    image: coturn/coturn:4.7.0
    restart: unless-stopped
    network_mode: host               # TURN needs the real public IP and a port range; no docker NAT
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --static-auth-secret=${TURN_SECRET:?set TURN_SECRET in .env}
      - --realm=${TURN_HOST:?set TURN_HOST in .env}
      - --server-name=${TURN_HOST}
    tmpfs: [/var/lib/coturn]
    security_opt: [no-new-privileges:true]
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
