<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="description" content="1:1 video call"/>
  <title>Video Call</title>
  <link rel="stylesheet" href="style.css"/>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="topbar">
    <label for="langSelect" class="id-label" id="langLabel">Language</label>
    <select id="langSelect" class="lang-select" aria-label="Language">
      <option value="ru">Русский</option>
      <option value="ua">Українська</option>
      <option value="en">English</option>
      <option value="de">Deutsch</option>
      <option value="el">Ελληνικά</option>
      <option value="fr">Français</option>
    </select>
  </div>
  <h1 id="tTitle">Video call 2027 v4</h1>
  <p class="subtitle" id="tSubtitle"></p>
  <div class="card">
    <div class="geo-row">
      <span id="myGeo">—</span>
      <span id="peerGeo"></span>
    </div>
    <div class="id-row">
      <span class="id-label" id="tYourId">Your ID:</span>
      <span class="peer-id" id="myId">…</span>
      <button class="btn btn-secondary" id="copyIdBtn" type="button">Copy ID</button>
    </div>
    <div class="id-row">
      <span class="id-label" id="tLink">Link:</span>
      <span class="link-box" id="roomLink">—</span>
      <button class="btn btn-secondary" id="copyLinkBtn" type="button">Copy link</button>
    </div>
    <div class="divider"></div>
    <div class="id-row">
      <input type="text" id="remoteId" placeholder="Peer ID" autocomplete="off"/>
      <button class="btn btn-primary" id="callBtn" type="button" disabled>Call</button>
      <button class="btn btn-danger" id="hangupBtn" type="button" hidden>Hang up</button>
    </div>
    <div class="actions">
      <button class="btn btn-secondary" id="muteBtn" type="button" disabled>Mic</button>
      <button class="btn btn-secondary" id="camBtn" type="button" disabled>Camera</button>
      <button class="btn btn-secondary" id="screenBtn" type="button" disabled>Screen</button>
      <button class="btn btn-secondary" id="shotLocalBtn" type="button" disabled>Screenshot (me)</button>
      <button class="btn btn-secondary" id="shotRemoteBtn" type="button" disabled>Screenshot (them)</button>
      <button class="btn btn-secondary" id="remoteVideoBtn" type="button" disabled>Hide video</button>
    </div>
    <p class="status" id="status">…</p>
    <p class="hint" id="tHint"></p>
  </div>

  <div class="videos">
    <div class="video-wrap" id="localWrap">
      <video id="localVideo" autoplay playsinline muted></video>
      <span class="video-label" id="localLabel">You</span>
      <div class="video-actions">
        <button class="btn" type="button" data-fs="localWrap" title="Fullscreen">⛶</button>
      </div>
    </div>
    <div class="video-wrap" id="remoteWrap">
      <video id="remoteVideo" autoplay playsinline></video>
      <span class="video-label" id="remoteLabel">Peer</span>
      <div class="video-actions">
        <button class="btn" type="button" data-fs="remoteWrap" title="Fullscreen">⛶</button>
      </div>
    </div>
  </div>

  <div class="card chat-card">
    <div class="chat-header" id="tChat">Chat</div>
    <div class="chat-log" id="chatLog" aria-live="polite"></div>
    <div class="chat-input-row">
      <input type="text" id="chatInput" maxlength="500" placeholder="Message…" autocomplete="off" disabled />
      <button class="btn btn-primary" id="chatSendBtn" type="button" disabled>Send</button>
    </div>
  </div>

</body>
</html>
